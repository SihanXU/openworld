<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outcomes in a Game World</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1f22; --muted: #5f6368; --line: #dcd8cf;
    --accent: #2f5d50; --accent-ink: #ffffff; --chosen: #e3efe9; --warn: #9a3412;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .muted { color: var(--muted); font-size: .95rem; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 0 0 18px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .scene { display: flex; gap: 20px; align-items: center; margin-bottom: 16px; }
  .scene img { width: 192px; height: auto; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--line); flex: none; background: #8aa35a; }
  .act { font-weight: 600; font-size: 1.05rem; }
  .hand { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: .9rem; }
  .hand img { height: 48px; width: auto; max-width: 120px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: #efece4; padding: 4px; }
  .what { background: #faf8f3; border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin: 4px 0 18px; }
  .label { font-weight: 600; margin: 14px 0 6px; }
  .scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .scale button, .pick, .go { font: inherit; cursor: pointer; }
  .scale button { padding: 10px 0; border: 1px solid var(--line); background: var(--card); border-radius: 8px; color: var(--ink); }
  .scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .pick { display: block; width: 100%; text-align: left; padding: 12px 14px; margin: 8px 0; border: 1px solid var(--line); background: var(--card); border-radius: 10px; color: var(--ink); }
  .pick[aria-pressed="true"] { background: var(--chosen); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pick b { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 2px; }
  .go { margin-top: 20px; padding: 12px 22px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; font-weight: 600; }
  .go:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .code { font: 600 1.3rem ui-monospace, monospace; letter-spacing: .05em; background: #faf8f3; padding: 8px 12px; border-radius: 8px; display: inline-block; }
  .note { color: var(--warn); font-size: .9rem; }
  ul { margin: 0 0 12px; padding-left: 22px; }
  @media (max-width: 560px) {
    .scene { flex-direction: column; align-items: flex-start; }
    .scene img { width: 160px; }
    .scale button { padding: 8px 0; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script id="data" type="application/json">__DATA__</script>
<script>window.STUDY_SUBMIT = "__SUBMIT__"</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent)
  const q = new URLSearchParams(location.search)
  const L = DATA.lists.length
  const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
  const pid = q.get('PROLIFIC_PID') || q.get('pid') || 'anon-' + Math.random().toString(36).slice(2, 10)
  const list = q.has('list') ? Number(q.get('list')) % L : q.get('PROLIFIC_PID') ? hash(pid) % L : Math.floor(Math.random() * L)
  let seed = hash(pid + '|' + list) || 1
  const rnd = () => (seed = (Math.imul(seed, 48271) >>> 0) % 2147483647) / 2147483647
  const shuffle = (xs) => { const a = [...xs]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }

  // the trials: the ratings in a shuffled order with two checks among them, then the choices with one
  const mine = DATA.lists[list]
  const rate = shuffle(mine.rate).map((t) => ({ kind: 'rate', ...t }))
  const choose = shuffle(mine.choose).map((t) => ({ kind: 'choose', ...t, shown: rnd() < 0.5 ? [t.a, t.b] : [t.b, t.a] }))
  const check = (id) => ({ ...DATA.checks.find((c) => c.id === id), kind: 'check' })
  rate.splice(Math.round(rate.length / 3), 0, check('absurd'))
  rate.splice(Math.round((rate.length * 2) / 3), 0, check('instructed'))
  choose.splice(Math.round(choose.length / 2), 0, { ...check('pick'), order: rnd() < 0.5 ? [0, 1] : [1, 0] })
  const TRIALS = [...rate, ...choose]

  const KEY = 'ow-study-' + pid
  const store = { get() { try { return JSON.parse(localStorage.getItem(KEY) || 'null') } catch { return null } }, set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)) } catch {} } }
  const state = store.get() || { participant: pid, list, started: new Date().toISOString(), step: 'welcome', at: 0, trials: [] }
  window.__study = state

  const app = document.getElementById('app')
  const h = (html) => { app.innerHTML = html; window.scrollTo(0, 0) }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const save = () => store.set(state)
  const go = (step) => { state.step = step; save(); render() }

  function scene(item, act) {
    const s = DATA.situations[item]
    return `<div class="scene"><img src="${s.frame}" alt="The scene"><div><div class="act">${esc(act ?? s.act)}.</div>${s.hand ? `<div class="hand"><img src="${s.hand}" alt="">in your hand</div>` : ''}</div></div>`
  }
  function scale(name, low, high) {
    return `<div class="label">${name === 'sense' ? 'Does this outcome make sense for these things?' : 'Does it fit this world?'}</div>
      <div class="scale" data-scale="${name}">${[1, 2, 3, 4, 5, 6, 7].map((n) => `<button type="button" aria-pressed="false" data-v="${n}">${n}</button>`).join('')}</div>
      <div class="ends"><span>${low}</span><span>${high}</span></div>`
  }
  const progress = () => `<div class="bar"><div style="width:${(100 * state.at / TRIALS.length).toFixed(1)}%"></div></div>`

  function render() {
    if (state.step === 'welcome') return h(`
      <div class="card">
        <h1>Outcomes in a game world</h1>
        <p>This study is about a 2D role-playing game. You will see small scenes from the game, each with something the player does, and a sentence saying what happens. You will judge whether each outcome makes sense and fits the game's world.</p>
        <p>It takes about 12 minutes: ${rate.length} outcomes to rate and ${choose.length} pairs of outcomes to choose between. There are no right or wrong answers, except on a few questions that check you are reading.</p>
        <p class="muted">[Consent: the study's approved consent text, the researchers' contact and the payment go here.]</p>
        <button class="go" id="next">I agree, start</button>
      </div>`), (document.getElementById('next').onclick = () => go('intro'))
    if (state.step === 'intro') return h(`
      <div class="card">
        <h2>The world</h2>
        <p>The game is set on the Frostfang Coast, a cold northern land of villages, river fords, forests and old barrows. Its people keep the faith of the Five Sufferings: long ago a martyr bore five punishments to end a Long Night.</p>
        <p>Things in the world are made of materials (wood, iron, cloth, stone, food…), and the elements (fire, water, ice, lightning, wind, earth) act on them as physics: fire spreads over dry things, water puts fires out and wets things, ice freezes what is wet.</p>
        <h2>What you do</h2>
        <ul>
          <li><b>Rate</b> one outcome: does it make sense for these things, and does it fit this world? (1 = not at all, 7 = completely)</li>
          <li><b>Choose</b> between two outcomes of the same scene: which makes more sense and fits this world better?</li>
        </ul>
        <p class="muted">Some outcomes include a line someone says, in quotation marks. "Nothing happens" is an outcome too.</p>
        <button class="go" id="next">Begin</button>
      </div>`), (document.getElementById('next').onclick = () => go('trials'))
    if (state.step === 'trials') return trial()
    if (state.step === 'comment') return h(`
      <div class="card">
        <h2>Almost done</h2>
        <p>Is there anything you would like to tell us about the outcomes or this study? (optional)</p>
        <textarea id="comment"></textarea>
        <button class="go" id="next">Finish</button>
      </div>`), (document.getElementById('next').onclick = () => { state.comment = document.getElementById('comment').value; state.finished = new Date().toISOString(); go('done'); send() })
    if (state.step === 'done') return done()
  }

  function trial() {
    const t = TRIALS[state.at]
    if (!t) return go('comment')
    const t0 = performance.now()
    const finish = (rec) => { state.trials.push({ ...rec, ms: Math.round(performance.now() - t0) }); state.at++; save(); render() }
    if (t.kind === 'rate' || (t.kind === 'check' && t.id !== 'pick')) {
      const what = t.kind === 'rate' ? DATA.situations[t.item].outcomes[t.cond] : t.what
      h(`${progress()}<div class="card">
        ${scene(t.item)}
        <div class="label">What happens:</div>
        <div class="what">${esc(what)}</div>
        ${scale('sense', 'Makes no sense', 'Makes complete sense')}
        ${scale('fit', 'Does not fit at all', 'Fits perfectly')}
        <button class="go" id="next" disabled>Next</button>
      </div>`)
      const got = {}
      app.querySelectorAll('.scale').forEach((row) => row.addEventListener('click', (ev) => {
        const b = ev.target.closest('button'); if (!b) return
        row.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
        got[row.dataset.scale] = Number(b.dataset.v)
        document.getElementById('next').disabled = !(got.sense && got.fit)
      }))
      document.getElementById('next').onclick = () => {
        if (t.kind === 'rate') return finish({ kind: 'rate', item: t.item, cond: t.cond, sense: got.sense, fit: got.fit })
        const e = t.expect
        const pass = e.senseAtMost !== undefined ? got.sense <= e.senseAtMost : got.sense === e.sense && got.fit === e.fit
        finish({ kind: 'check', id: t.id, sense: got.sense, fit: got.fit, pass })
      }
      return
    }
    const texts = t.kind === 'choose' ? t.shown.map((c) => DATA.situations[t.item].outcomes[c]) : t.order.map((k) => t.outcomes[k])
    h(`${progress()}<div class="card">
      ${scene(t.item)}
      <div class="label">Which outcome makes more sense and fits this world better?</div>
      ${texts.map((s, k) => `<button type="button" class="pick" aria-pressed="false" data-k="${k}"><b>Outcome ${k + 1}</b>${esc(s)}</button>`).join('')}
      <button class="go" id="next" disabled>Next</button>
    </div>`)
    let picked
    app.querySelectorAll('.pick').forEach((b) => (b.onclick = () => {
      picked = Number(b.dataset.k)
      app.querySelectorAll('.pick').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
      document.getElementById('next').disabled = false
    }))
    document.getElementById('next').onclick = () => {
      if (t.kind === 'choose') return finish({ kind: 'choose', item: t.item, a: t.a, b: t.b, shown: t.shown, winner: t.shown[picked] })
      finish({ kind: 'check', id: t.id, choice: t.order[picked], pass: t.order[picked] === t.expect.choice })
    }
  }

  // where the results go: ?submit=, else the server that serves the page (study.ts serve), else nowhere (saved as a file)
  const submitTo = () => q.get('submit') || (window.STUDY_SUBMIT && !window.STUDY_SUBMIT.startsWith('__') ? window.STUDY_SUBMIT : '')
  const result = () => ({ participant: state.participant, list: state.list, started: state.started, finished: state.finished, trials: state.trials, comment: state.comment, agent: navigator.userAgent })
  function send() {
    const url = submitTo()
    if (!url || state.sent) return
    fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(result()) })
      .then((r) => { state.sent = r.ok; save(); render() })
      .catch(() => { state.sent = false; save(); render() })
  }
  function done() {
    const cc = q.get('cc')
    const url = submitTo()
    h(`<div class="card">
      <h1>Thank you</h1>
      ${url ? (state.sent ? '<p>Your answers have been sent.</p>' : '<p class="note">Your answers could not be sent automatically. Please save them with the button below and send the file to the researchers.</p>') : '<p>Please save your answers with the button below.</p>'}
      ${cc ? `<p>Your completion code: <span class="code">${esc(cc)}</span></p><p><a class="go" style="display:inline-block;text-decoration:none" href="https://app.prolific.com/submissions/complete?cc=${encodeURIComponent(cc)}">Return to Prolific</a></p>` : ''}
      <div class="row"><button class="go" id="save" type="button">Save my answers</button></div>
    </div>`)
    document.getElementById('save').onclick = () => {
      const blob = new Blob([JSON.stringify(result(), null, 1)], { type: 'application/json' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = `study-${state.participant}.json`
      a.click()
    }
  }
  render()
})()
</script>
</body>
</html>
