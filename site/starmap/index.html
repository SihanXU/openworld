<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Star map · OpenWorld</title>
    <style>
        html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; color: #dfe6f3; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; touch-action: none; cursor: grab; }
        canvas:active { cursor: grabbing; }
        body.video canvas { cursor: default; }
        body.video .ui, body.video #tip, body.embed .ui, body.embed #tip { display: none; }
        body.embed canvas { pointer-events: none; }
        .ui { position: fixed; left: 16px; top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
        .ui button { font: 500 14px/1 inherit; color: #dfe6f3; background: rgba(20,28,46,0.85); border: 1px solid rgba(143,178,255,0.35); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
        .ui button:hover { border-color: #8fb2ff; color: #fff; }
        .ui button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        body.loading::after { content: 'loading…'; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #8f9ab0; font-size: 14px; letter-spacing: 0.1em; }
        #tip { position: fixed; display: none; pointer-events: none; padding: 8px 12px; background: rgba(14,20,34,0.94); border: 1px solid rgba(143,178,255,0.3); border-radius: 8px; font-size: 13px; max-width: 260px; }
        #tip b { display: block; font-weight: 600; color: #fff; }
        #tip span { color: #8f9ab0; font-size: 12px; }
    </style>
</head>
<body class="loading">
    <canvas id="c"></canvas>
    <div class="ui">
        <button id="story" class="primary">▶ Play</button>
        <button id="skip" style="display:none">Skip ▸</button>
        <button id="ford">The Ford</button>
        <button id="home">Whole world</button>
    </div>
    <div id="tip"></div>
    <script type="module" src="starmap.js"></script>
</body>
</html>
